<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QQ 机器人管理</title>
  <style>
    :root {
      --bg: #0b1218;
      --panel: #121c26;
      --line: #1e3344;
      --text: #e8f4ff;
      --muted: #8eb6cc;
      --cyan: #3de0ff;
      --cyan-dim: #1a8fa8;
      --ok: #3dd68c;
      --bad: #ff6b7a;
      --radius: 12px;
      --font: "PingFang SC", "SF Pro Text", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: radial-gradient(circle at 20% 0%, #123044 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 18, 26, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    header img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
    main { max-width: 980px; margin: 0 auto; padding: 20px 24px 40px; }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .tabs button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
    }
    .tabs button.active {
      color: var(--bg);
      background: linear-gradient(135deg, var(--cyan), #67f0ff);
      border-color: transparent;
      font-weight: 600;
    }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
    }
    .panel.active { display: block; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bad);
      box-shadow: 0 0 10px rgba(255, 107, 122, 0.5);
    }
    .status-dot.on {
      background: var(--ok);
      box-shadow: 0 0 10px rgba(61, 214, 140, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    button.action {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
      font-weight: 600;
    }
    .primary { background: var(--cyan); color: #062029; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .danger { background: #3a1820; color: #ffb3bc; border: 1px solid #6b2a36; }
    label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 0.88rem; }
    textarea, input, select {
      width: 100%;
      background: #0a131b;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      line-height: 1.45;
    }
    textarea { min-height: 120px; resize: vertical; }
    pre.log {
      background: #070d12;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      max-height: 280px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #b8d7e8;
      white-space: pre-wrap;
    }
    .list { display: grid; gap: 8px; margin-top: 10px; }
    .list-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      background: #0c151d;
    }
    .list-item:hover { border-color: var(--cyan-dim); }
    .list-item.selected { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(61, 224, 255, 0.25); }
    .hint { color: var(--muted); font-size: 0.82rem; margin-top: 8px; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #102532;
      border: 1px solid var(--cyan-dim);
      padding: 10px 14px;
      border-radius: 10px;
      opacity: 0;
      transform: translateY(8px);
      transition: 0.2s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <img src="/admin/icon.png" alt="icon" />
    <div>
      <h1>QQ 机器人管理</h1>
      <p>本机控制台 · 仅 127.0.0.1 可访问</p>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button class="active" data-tab="run">运行</button>
      <button data-tab="persona">人设</button>
      <button data-tab="policy">回复策略</button>
      <button data-tab="impressions">印象</button>
    </div>

    <section class="panel active" id="panel-run">
      <div class="row">
        <span class="status-dot" id="status-dot"></span>
        <strong id="status-text">检查中…</strong>
        <span class="badge" id="status-pid"></span>
        <span class="badge" id="status-model"></span>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="action primary" id="btn-start">启动机器人</button>
        <button class="action danger" id="btn-stop">停止</button>
        <button class="action ghost" id="btn-refresh">刷新状态</button>
      </div>
      <p class="hint">启动后会连 QQ WebSocket 网关；人设和 reply_policy 保存后下一条消息即生效，不必重启。</p>
      <label>最近日志</label>
      <pre class="log" id="log-box">加载中…</pre>
      <button class="action ghost" id="btn-log">刷新日志</button>
    </section>

    <section class="panel" id="panel-persona">
      <label>persona（整体人设）</label>
      <textarea id="persona"></textarea>
      <label>anti_injection（每行一条）</label>
      <textarea id="anti"></textarea>
      <label>stay_on_prompt（每行一条）</label>
      <textarea id="stay"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="action primary" id="btn-save-prompt">保存人设</button>
      </div>
    </section>

    <section class="panel" id="panel-policy">
      <p class="hint">上方改回复开关与频率；下方两块写入系统提示的防注入 / 不得脱离人设。保存后下一条消息生效。</p>
      <label>回复开关与频率（reply_policy.toml）</label>
      <textarea id="policy" style="min-height:220px;font-family:ui-monospace,monospace;font-size:0.85rem"></textarea>
      <label>防注入（每行一条）</label>
      <textarea id="policy-anti" style="min-height:120px"></textarea>
      <label>不得脱离人设（每行一条）</label>
      <textarea id="policy-stay" style="min-height:120px"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="action primary" id="btn-save-policy">保存策略</button>
      </div>
    </section>

    <section class="panel" id="panel-impressions">
      <div class="grid2">
        <div>
          <label>用户列表</label>
          <input id="imp-search" placeholder="按昵称搜索…" />
          <div class="list" id="imp-list"></div>
        </div>
        <div>
          <label>编辑选中用户</label>
          <input id="imp-openid" readonly placeholder="user_openid" />
          <input id="imp-username" placeholder="昵称" />
          <input id="imp-qq" placeholder="QQ 号（若已知）" />
          <textarea id="imp-text" placeholder="印象正文…" style="min-height:220px"></textarea>
          <div class="row" style="margin-top:12px">
            <button class="action primary" id="btn-save-imp">保存印象</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const toast = (msg) => {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    };
    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || res.statusText);
      }
      const ct = res.headers.get("content-type") || "";
      return ct.includes("application/json") ? res.json() : res.text();
    }
    function linesToList(text) {
      return (text || "").split("\n").map((s) => s.trim()).filter(Boolean);
    }
    function listToLines(arr) {
      return (arr || []).join("\n");
    }

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        $("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    let impressions = [];
    let selectedOpenid = "";

    async function refreshStatus() {
      const s = await api("/admin/api/status");
      const running = s.running && s.healthy;
      $("status-dot").classList.toggle("on", running);
      $("status-text").textContent = running ? "运行中" : (s.running ? "进程在但未就绪" : "已停止");
      $("status-pid").textContent = s.pid ? ("pid " + s.pid) : "无 pid";
      $("status-model").textContent = s.llm_model || "";
    }

    async function refreshLogs() {
      const data = await api("/admin/api/logs?lines=100");
      $("log-box").textContent = data.text || "";
    }

    async function loadPrompt() {
      const p = await api("/admin/api/prompt");
      $("persona").value = p.persona || "";
      $("anti").value = listToLines(p.anti_injection);
      $("stay").value = listToLines(p.stay_on_prompt);
    }

    async function loadPolicy() {
      const p = await api("/admin/api/reply-policy");
      $("policy").value = p.text || "";
      $("policy-anti").value = p.anti_injection || "";
      $("policy-stay").value = p.stay_on_prompt || "";
    }

    function renderImpressions(filter) {
      const needle = (filter || "").trim().toLowerCase();
      const list = $("imp-list");
      list.innerHTML = "";
      impressions
        .filter((r) => !needle || (r.username || "").toLowerCase().includes(needle) || (r.user_openid || "").includes(needle))
        .forEach((r) => {
          const div = document.createElement("div");
          div.className = "list-item" + (r.user_openid === selectedOpenid ? " selected" : "");
          div.innerHTML = `<strong>${r.username || "（无昵称）"}</strong><br><span style="color:#8eb6cc;font-size:0.8rem">${r.user_openid}</span>`;
          div.onclick = () => selectImpression(r.user_openid);
          list.appendChild(div);
        });
    }

    function selectImpression(openid) {
      selectedOpenid = openid;
      const r = impressions.find((x) => x.user_openid === openid) || {};
      $("imp-openid").value = openid;
      $("imp-username").value = r.username || "";
      $("imp-qq").value = r.qq || "";
      $("imp-text").value = r.impression || "";
      renderImpressions($("imp-search").value);
    }

    async function loadImpressions() {
      impressions = await api("/admin/api/impressions");
      impressions.sort((a, b) => (a.username || "").localeCompare(b.username || "", "zh"));
      renderImpressions($("imp-search").value);
      if (selectedOpenid) selectImpression(selectedOpenid);
    }

    $("btn-start").onclick = async () => {
      try { await api("/admin/api/bot/start", { method: "POST" }); toast("已启动"); await refreshStatus(); await refreshLogs(); }
      catch (e) { toast("启动失败"); }
    };
    $("btn-stop").onclick = async () => {
      try { await api("/admin/api/bot/stop", { method: "POST" }); toast("已停止"); await refreshStatus(); }
      catch (e) { toast("停止失败"); }
    };
    $("btn-refresh").onclick = () => refreshStatus().then(() => toast("已刷新"));
    $("btn-log").onclick = () => refreshLogs().then(() => toast("日志已更新"));

    $("btn-save-prompt").onclick = async () => {
      const body = {
        persona: $("persona").value,
        anti_injection: linesToList($("anti").value),
        stay_on_prompt: linesToList($("stay").value),
      };
      await api("/admin/api/prompt", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      toast("人设已保存");
    };
    $("btn-save-policy").onclick = async () => {
      await api("/admin/api/reply-policy", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text: $("policy").value,
          anti_injection: $("policy-anti").value,
          stay_on_prompt: $("policy-stay").value,
        }),
      });
      toast("策略已保存");
      await loadPolicy();
    };
    $("btn-save-imp").onclick = async () => {
      const openid = $("imp-openid").value.trim();
      if (!openid) { toast("请先选用户"); return; }
      const body = { username: $("imp-username").value, qq: $("imp-qq").value, impression: $("imp-text").value };
      await api("/admin/api/impressions/" + encodeURIComponent(openid), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      toast("印象已保存");
      await loadImpressions();
    };
    $("imp-search").oninput = (e) => renderImpressions(e.target.value);

    (async () => {
      try {
        await refreshStatus();
        await refreshLogs();
        await loadPrompt();
        await loadPolicy();
        await loadImpressions();
      } catch (e) {
        toast("加载失败，请确认管理后台在运行");
      }
    })();
  </script>
</body>
</html>
